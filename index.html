<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story Video Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0b0d16}
#home{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 10%,#1d2450,transparent),radial-gradient(900px 600px at 90% 90%,#3a1d48,transparent),#0b0d16;color:#e9ecf6;font-family:Inter,system-ui,sans-serif;z-index:50;overflow:auto;padding:24px}
#home h1{font-size:30px;margin:0 0 6px;text-align:center;letter-spacing:-.01em}#home p.s{color:#9aa0bb;text-align:center;margin:0 0 28px}
#home .pick{display:grid;grid-template-columns:repeat(2,minmax(260px,380px));gap:20px}@media(max-width:700px){#home .pick{grid-template-columns:1fr}}
#home button.m{all:unset;cursor:pointer;background:#141a30;border:1px solid #2a3150;border-radius:18px;padding:22px;display:block;transition:transform .15s,border-color .15s}
#home button.m:hover,#home button.m:focus-visible{transform:translateY(-3px);border-color:#ffd23f}
#home .m canvas{width:100%;aspect-ratio:16/9;border-radius:12px;display:block;background:#0b0d16;margin-bottom:14px}
#home .m b{font-size:19px;display:block;margin-bottom:6px}#home .m span{color:#9aa0bb;font-size:13.5px;line-height:1.5;display:block}
#home .m ul{margin:10px 0 0 18px;padding:0;color:#c9cde0;font-size:13px;line-height:1.7}
#home .f{color:#6f7594;font-size:12px;text-align:center;margin-top:22px}
details.adv{margin-top:10px}details.adv summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:8px}
</style></head>
<body>
<div id="home"><div>
<h1>What do you want to make?</h1><p class="s">Both tools share the same engine: auto-sync to your narration, quick export, built-in MP3 converter.</p>
<div class="pick">
<button class="m" data-go="chat"><canvas id="hc" width="640" height="360"></canvas><b>💬 Chat story video</b><span>Your story plays out as group-chat messages that pop up in time with the narration.</span>
<ul><li>Chatfics &amp; prose with dialogue</li><li>Automatic cast, avatars &amp; themes</li><li>Intro chat, story cards, whole-story export</li></ul></button>
<button class="m" data-go="narr"><canvas id="hn" width="640" height="360"></canvas><b>✏️ Narration video</b><span>Karaoke-style subtitles over a character that draws itself, or an animated mood scene.</span>
<ul><li>Self-drawing sketch from your images</li><li>Rainy window, lofi room, fireplace, paper-cut, synthwave + auto scenes</li><li>Chapter title cards &amp; emoji pop-ups</li></ul></button>
</div><p class="f">Your choice is remembered. Switch any time with “⇄ Switch tool” at the top.</p></div></div>
<div id="root"></div>
<template id="tpl-chat"><style>
:root{--bg:#0b0d16;--panel:#131726;--panel2:#191e31;--line:#262c44;--fg:#e9ecf6;--muted:#8a90aa;--acc:#6d8cff;--acc2:#8fa6ff;--ok:#43d19e;--warn:#ffb547;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#0e1120;position:sticky;top:0;z-index:5}
header.top h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em}
header.top .sub{color:var(--muted);font-size:12px}
header.top .sp{flex:1}
.app{display:grid;grid-template-columns:minmax(360px,520px) 1fr;gap:18px;padding:18px 20px;align-items:start}
@media(max-width:980px){.app{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card>h2{margin:0;padding:12px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.card>h2 .n{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#0b0d16;display:grid;place-items:center;font-size:11px;font-weight:700}
.card>h2 .r{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.body{padding:12px 14px}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:10px}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{background:#0d1020;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;line-height:1.45;font-size:13px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.btn{background:#20263d;border:1px solid #2e3655;border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:#283050}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0b0d16;font-weight:600}
.btn.p:hover{background:var(--acc2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:#1d2338;color:var(--muted);border:1px solid var(--line)}
.chip.ok{color:var(--ok);border-color:rgba(67,209,158,.35)}
.chip.warn{color:var(--warn);border-color:rgba(255,181,71,.35)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.hint code{background:#0d1020;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11.5px}
.cast{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.castrow{display:grid;grid-template-columns:34px 1fr 44px 64px;gap:8px;align-items:center;background:#0f1324;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.castrow.me{border-color:rgba(109,140,255,.55);background:rgba(109,140,255,.07)}
.castrow .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;border:0;cursor:pointer;padding:0;overflow:hidden;position:relative}
.castrow .av img{width:100%;height:100%;object-fit:cover}
.castrow .av:hover::after{content:'＋';position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:14px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:1.5px solid var(--line);border-radius:10px;padding:0;cursor:pointer;background:#0d1020;overflow:hidden;text-align:left}
.sw canvas{display:block;width:100%;height:auto}
.sw span{display:block;padding:5px 8px;font-size:12px;color:var(--muted)}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,140,255,.18)}.sw.on span{color:var(--fg)}
.castrow input[type=color]{width:40px;height:28px;border:0;background:none;padding:0;cursor:pointer}
.castrow .cnt{font-size:11px;color:var(--muted);text-align:right}
.castrow input[type=text]{padding:5px 8px}
.castrow select{padding:5px 6px}
.stagewrap{position:sticky;top:70px}
.stage{background:#05060b;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.stage canvas{display:block;max-width:100%;max-height:calc(100vh - 260px);height:auto}
.player{display:flex;align-items:center;gap:10px;margin-top:10px}
.player input[type=range]{flex:1;accent-color:var(--acc)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:110px;text-align:center}
.prog{height:8px;background:#1b2034;border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#a98bff);transition:width .2s}
.drop{border:1.5px dashed #34405f;border-radius:10px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;font-size:12.5px;transition:all .15s;flex:1;min-width:150px}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--fg);background:rgba(109,140,255,.06)}
.drop.done{border-style:solid;border-color:rgba(67,209,158,.45);color:var(--ok)}
.drop b{display:block;color:var(--fg);font-weight:600;margin-bottom:2px;font-size:13px}
input[type=file]{display:none}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:1px solid transparent;border-radius:7px;padding:5px 10px;color:var(--muted);cursor:pointer}
.tabs button.on{background:#20263d;border-color:#2e3655;color:var(--fg)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20263d;border:1px solid #34405f;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--acc)}
.muted{color:var(--muted)}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.0)}50%{box-shadow:0 0 0 6px rgba(255,210,63,.45)}}.btn.pulse{animation:pulseG 1.4s ease-in-out infinite}
</style>
<header class="top"><h1>💬 Chat Story Video Maker</h1><span class="sub">story + narration → synced chat-bubble video</span><span class="sp"></span><span class="chip" id="saveState">Settings saved in this browser</span><button class="btn" data-switch>⇄ Switch tool</button></header>

<div class="app">
<div>
  <!-- 1. Chapter -->
  <div class="card">
    <h2><span class="n">1</span> Story <span class="r" id="wordCount"></span></h2>
    <div class="body">
      <input type="hidden" id="chNum" value="1"><input type="hidden" id="chTitle" value="Chapter 1">
      <div class="row">
        <div class="grow"><label class="f">Video title</label><input type="text" id="storyName" placeholder="e.g. Chosen One Support Chat (Kanto)"></div>
        <div style="width:170px"><label class="f">Author</label><input type="text" id="author" placeholder="e.g. HeadcaseKiller"></div>
      </div>
      <div class="row"><div class="grow">
        <label class="f">Intro (optional): a short chat after the title card, in <code>Name: message</code> lines</label>
        <textarea id="introMsg" rows="3" class="code" spellcheck="false" placeholder="TheChosenOne: today I woke up late…&#10;Several users are typing…"></textarea>
      </div></div>
      <div class="row"><label class="check"><input type="checkbox" id="introAll"> Play the intro chat on every chapter (otherwise chapter 1 only)</label></div>
      <div class="row" id="chapRow" style="display:none">
        <div class="grow"><label class="f">Chapters found in your story: pick one to convert</label><select id="chapSel"></select></div>
        <button class="btn" id="chapPrev" title="Previous chapter" style="align-self:flex-end">◀</button><button class="btn" id="chapNext" title="Next chapter" style="align-self:flex-end">▶</button>
      </div>
      <div class="row"><div class="grow">
        <label class="f">Story text: one chapter or the whole story (chapters are found automatically)</label>
        <textarea id="story" rows="9" placeholder="Paste one chapter here…"></textarea>
      </div></div>
      <div class="row">
        <button class="btn p" id="convertBtn">Convert to chat script →</button>
        <label class="check"><input type="checkbox" id="optNarr" checked> Keep prose scenes (story cards)</label>
      </div>
      <p class="hint">Chat-format stories (<code>User: message</code>) are read as they are. In prose, dialogue in quotes becomes bubbles and the speaker is guessed (marked <code>?</code> in step 3).</p>
    </div>
  </div>

  <!-- 2. Narration -->
  <div class="card">
    <h2><span class="n">2</span> Narration sync <span class="r" id="syncState">not synced: using reading speed</span></h2>
    <div class="body">
      <div class="row" style="margin-bottom:10px">
        <div class="grow"><label class="f">Intro</label><select id="introSrc">
          <option value="silent">Silent: title card + intro chat play before the narration</option>
          <option value="inaudio">My narration audio starts with a spoken intro</option></select></div>
        <div style="width:140px" id="introLenBox"><label class="f">Intro length (sec)</label><input type="number" id="introLen" value="30" min="0" step="0.5"></div>
      </div>
      <p class="hint" id="introSrcHint" style="margin:-4px 0 10px"></p>
      <div class="row">
        <div class="drop" id="srtDrop"><b>Subtitles (.srt / .vtt)</b><span id="srtLabel">Drop or click: messages pop up exactly when your voice reads them</span></div>
        <div class="drop" id="audDrop"><b>Narration audio</b><span id="audLabel">Drop or click: MP3, M4A or WAV, any length. Baked into the video</span></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn p" id="autoSyncBtn" style="display:none">✨ Sync chat to my audio</button>
        <button class="btn" id="saveSrtBtn" style="display:none">⬇ Save the timing as .srt</button>
        <button class="btn" id="mp3Btn" style="display:none" title="Make an MP3 copy of the loaded audio">⇄ Convert to MP3</button>
      </div>
      <p class="hint" id="fullInfo" style="display:none;color:var(--fg)"></p>
      <p class="hint">MP3, M4A/AAC and WAV of any length. No subtitles? Load the audio and click <b>✨ Sync chat to my audio</b>. One narration for the whole story works too: every chapter is found inside it.</p>
      <input type="file" id="srtFile" accept=".srt,.vtt,text/plain">
      <input type="file" id="audFile" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,video/mp4">
      <details class="adv"><summary>Fine-tune timing</summary><div class="row">
        <div style="width:150px"><label class="f">Reading speed (no subtitles)</label><input type="number" id="wpm" value="150" min="60" max="400"></div>
        <div style="width:150px"><label class="f">Shift all messages (sec)</label><input type="number" id="offset" value="0" step="0.1"></div>
        <div style="width:120px"><label class="f">End padding (sec)</label><input type="number" id="endPad" value="3" step="0.5" min="0"></div>
      </div></details>
    </div>
  </div>

  <!-- 3. Script -->
  <div class="card">
    <h2><span class="n">3</span> Chat script <span class="r"><span id="msgCount"></span> <span class="chip warn" id="unsure" style="display:none"></span></span></h2>
    <div class="body">
      <textarea id="script" class="code" rows="14" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn" id="nextUnsure">Find next <b>?</b></button>
        <button class="btn" id="clearUnsure">Accept all guesses</button>
        <span class="muted" style="font-size:12px" id="cursorInfo"></span>
      </div>
      <p class="hint">One message per line. <code>Name: text</code> is a bubble, <code>&gt;&gt; text</code> is a full-screen story card for prose scenes, <code>[Chat name]</code> switches to another group chat, <code>! Rose has left the chat</code> is a system notice (a line with "typing" shows typing dots), and <code>&gt; text</code> is a grey narration note. Chat-format stories are read as-is. A <code>?</code> after a name means a guessed speaker: fix it or leave it, since the <code>?</code> never shows in the video. To pin a time, start the line with <code>[1:23.5]</code>.</p>
    </div>
  </div>

  <!-- 4. Cast -->
  <div class="card">
    <h2><span class="n">4</span> Cast <span class="r">automatic · remembered</span></h2>
    <div class="body">
      <div class="row" style="margin-bottom:10px"><div class="grow"><label class="f">Right side ("me", like your own texts)</label><select id="meSel"></select></div></div>
      <div class="cast" id="cast"></div>
      <p class="hint">Characters are added automatically, each with its own colour that stays the same in every chapter. The main character (who talks most across your chapters) goes on the right. <b>Click an avatar</b> to give that character a picture; right-click removes it.</p>
    </div>
  </div>

  <!-- 5. Look -->
  <div class="card">
    <h2><span class="n">5</span> Look &amp; sound</h2>
    <div class="body">
      <label class="f">Theme</label>
      <div class="themes" id="themes"></div>
      <div class="kv" style="margin-top:12px">
        <div><label class="f">Video size</label><select id="res">
          <option value="1920x1080">1920×1080 · YouTube (16:9)</option>
          <option value="1280x720">1280×720 · faster export</option>
          <option value="1080x1920">1080×1920 · Shorts / Reels (9:16)</option>
        </select></div>
        <div><label class="f">Text size</label><select id="tsize"><option value="0.9">Small</option><option value="1" selected>Normal</option><option value="1.15">Large</option><option value="1.3">Extra large</option></select></div>
        <div><label class="f">Pop sound volume</label><select id="popVol"><option value="0">Off</option><option value="0.25">Soft</option><option value="0.5" selected>Medium</option><option value="0.9">Loud</option></select></div>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="optTyping" checked> Typing dots before messages</label>
        <label class="check"><input type="checkbox" id="optNames" checked> Show names</label>
        <label class="check"><input type="checkbox" id="optTime" checked> Timestamps</label>
        <label class="check"><input type="checkbox" id="optIntro" checked> Intro (title card + intro chat)</label>
      </div>
    </div>
  </div>
</div>

<!-- right: preview + export -->
<div class="stagewrap">
  <div class="stage"><canvas id="pv" width="1280" height="720"></canvas></div>
  <div class="player">
    <button class="btn" id="playBtn" style="width:84px;justify-content:center">▶ Play</button>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="card" style="margin-top:14px">
    <h2><span class="n">6</span> Export video <span class="r" id="encInfo"></span></h2>
    <div class="body">
      <div class="row">
        <div style="width:200px"><label class="f">Quality</label><select id="qual"><option value="std">Standard · 30 fps</option><option value="small">Smaller file · 24 fps</option></select></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn p" id="exportBtn">⬇ Export this chapter</button>
        <button class="btn" id="exportAllBtn" style="display:none">⬇ All chapters (separate files)</button>
        <button class="btn" id="exportWholeBtn" style="display:none">⬇ Whole story as one video</button>
        <button class="btn" id="cancelBtn" style="display:none">Cancel</button>
      </div>
      <p class="hint" id="sizeEst"></p>
      <div class="prog"><i id="progBar"></i></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0" id="expMsg">⚡ Quick export is always on: still moments are stored once instead of 30 times a second, so the picture is identical and the export is faster. Chrome or Edge, keep the tab in front.</p>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

</template>
<template id="tpl-narr"><style>

.checks label{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:13px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #0b0d16 inset}
.stage{position:sticky;top:66px}
.pvwrap{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;justify-content:center}
canvas#pv{display:block;max-width:100%;max-height:62vh;background:#000}
.ctrl{display:flex;gap:10px;align-items:center;margin:10px 0}
.ctrl input[type=range]{flex:1;accent-color:var(--acc)}
.ctrl .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:120px;text-align:right}
.chaps{max-height:260px;overflow:auto}
.chap{display:grid;grid-template-columns:54px 1fr 130px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1e2338}
.chap:last-child{border-bottom:0}
.chap .tm{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer}
.chap .tm:hover{color:var(--acc)}
.chap .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap select{padding:5px 6px;font-size:12px}
.prog{height:8px;background:#0d1020;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:10px 0 6px}
.prog>div{height:100%;width:0;background:var(--acc);transition:width .2s}
#expMsg{font-size:12px;color:var(--muted);min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1d2340;border:1px solid #384170;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#1d2340;color:var(--muted);font-size:11px}
.status{font-size:12px;margin-top:8px;line-height:1.5}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.th{position:relative;width:76px;height:76px;border-radius:10px;border:2px solid var(--line);background:#0d1020;padding:0;cursor:pointer;overflow:hidden;display:grid;place-items:center}
.th canvas{display:block;width:72px;height:72px}
.th.on{border-color:var(--acc)}
.th.add{border-style:dashed;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.th.add b{font-size:22px;color:var(--fg);font-weight:500}.th.add span{font-size:11px}
.th .bd{position:absolute;left:4px;top:4px;background:var(--acc);color:#111;border-radius:10px;font-size:10px;font-weight:800;padding:1px 6px}
.th .dot{position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px #0d1020}
details.best{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#0d1020}
details.best summary{cursor:pointer;font-weight:600;font-size:13px}
details.best ul{margin:8px 0 4px 18px;padding:0;color:var(--muted);font-size:12px;line-height:1.6}
details.best li b{color:var(--fg)}
details.best code{display:block;white-space:pre-wrap;background:#161a30;border-radius:6px;padding:8px;margin:6px 0;color:var(--fg);font-size:12px}
.th .rm{position:absolute;right:3px;top:1px;color:#fff;background:rgba(0,0,0,.55);border-radius:50%;width:18px;height:18px;line-height:17px;font-size:13px;text-align:center}

    let pin=null;const tm=line.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*|^\[(\d+(?:\.\d+)?)\]\s*/);
    if(tm){pin=tm[3]!=null?parseFloat(tm[3]):parseInt(tm[1])*60+parseFloat(tm[2]);line=line.slice(tm[0].length)}

    const ch=line.match(/^\[([^\]]+)\]$/)||line.match(/^#+\s*(.+)$/);
    if(ch){chat=ch[1].trim();msgs.push({kind:'c',text:chat,chat,pin,ln});return}
    if(line.startsWith('>>')){msgs.push({kind:'p',text:line.replace(/^>>\s*/,''),chat,pin,ln});return}
    if(line.startsWith('>')){msgs.push({kind:'n',text:line.replace(/^>\s*/,''),chat,pin,ln});return}
    if(line.startsWith('!')){const s=line.replace(/^!\s*/,'');

      const nm=s.match(/^([^\s]+)\s+(.*)$/);msgs.push({kind:'s',text:s,name:nm?nm[1]:'',rest:nm?nm[2]:s,chat,pin,ln});return}
    const m=line.match(/^([^:]{1,40}?)(\?)?:\s*(.+)$/);

    msgs.push({kind:'n',text:line,chat,pin,ln});
  });
  return msgs;
}

/* ================= scene rendering (pure functions of time → seek-safe) ================= */
const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;

const ENV=new Map();
function getEnv(ci,W,H){const sc=sceneOf(ci);const key=`${ci}|${sc}|${W}x${H}|${SEED}`;let e=ENV.get(key);if(e)return e;
  if(ENV.size>6)ENV.delete(ENV.keys().next().value);
  const R=rnd(hashStr(key));const base={space:235,ocean:200,fire:15,ice:205,city:250,nature:20,mystery:270,calm:190+hashStr(String(SEED+ci))%140,rain:215,lofi:262,cabin:22,papercut:hashStr(String(SEED))%360,synthwave:268}[sc];
  const h=base+(R()-.5)*(sc==='fire'?24:sc==='calm'||sc==='papercut'?0:sc==='synthwave'||sc==='lofi'?30:50);
  const P=new Float32Array(400*8);for(let i=0;i<P.length;i++)P[i]=R();
  e={sc,h,P,R,W,H,s:Math.min(W,H)/1080};SCENE_INIT[sc](e);ENV.set(key,e);return e}
function drawScene(ctx,e,t){SCENE_DRAW[e.sc](ctx,e,t)}
const SCENE_INIT={},SCENE_DRAW={};
// helpers
const pr=(e,i,j)=>e.P[(i*8+j)%e.P.length];
const wrapv=(v,m)=>((v%m)+m)%m;

/* space */
SCENE_INIT.space=e=>{const{W,H,h,s}=e;const bg=mk(W,H),x=bg.getContext('2d');x.fillStyle=vgrad(x,H,[[0,hsl(h,55,5)],[1,hsl(h+35,50,13)]]);x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';for(let i=0;i<4;i++){const g=glow(hsl(h+[0,60,-40,120][i],70,45,.22));const r=Math.max(W,H)*(.35+e.R()*.3);x.drawImage(g,e.R()*W-r,e.R()*H-r,r*2,r*2)}
  x.globalCompositeOperation='source-over';for(let i=0;i<500;i++){x.fillStyle=`rgba(255,255,255,${.1+e.R()*.3})`;x.fillRect(e.R()*W,e.R()*H,s*1.1,s*1.1)}e.bg=bg;
  const R0=Math.min(W,H)*.2,pc=mk(Math.ceil(R0*3.2),Math.ceil(R0*3.2)),p=pc.getContext('2d'),cx=pc.width/2,cy=pc.height/2,ph=h+150+e.R()*60;
  p.save();p.beginPath();p.arc(cx,cy,R0,0,TAU);p.clip();const g=p.createRadialGradient(cx-R0*.4,cy-R0*.4,R0*.1,cx,cy,R0*1.05);g.addColorStop(0,hsl(ph,60,62));g.addColorStop(.6,hsl(ph+10,55,35));g.addColorStop(1,hsl(ph+20,60,10));p.fillStyle=g;p.fillRect(0,0,pc.width,pc.height);
  for(let k=0;k<6;k++){p.fillStyle=hsl(ph+(e.R()-.5)*40,50,50,.13);p.beginPath();p.ellipse(cx,cy-R0+e.R()*R0*2,R0*1.3,R0*(.05+e.R()*.08),.2,0,TAU);p.fill()}p.restore();
  p.strokeStyle=hsl(ph+30,40,80,.45);p.lineWidth=R0*.06;p.beginPath();p.ellipse(cx,cy,R0*1.55,R0*.33,-.35,0,TAU);p.stroke();p.strokeStyle=hsl(ph+30,40,80,.2);p.lineWidth=R0*.03;p.beginPath();p.ellipse(cx,cy,R0*1.38,R0*.28,-.35,0,TAU);p.stroke();
  e.planet=pc;e.pg=glow(hsl(ph,70,60,.35))};
SCENE_DRAW.space=(ctx,e,t)=>{const{W,H,s}=e;ctx.drawImage(e.bg,0,0);
  const land=W>=H;const px=W*(land?.77:.7)+Math.sin(t*.05)*W*.012,py=H*(land?.32:.22)+Math.sin(t*.07)*H*.012,pw=e.planet.width;
  ctx.drawImage(e.pg,px-pw*.75,py-pw*.75,pw*1.5,pw*1.5);ctx.drawImage(e.planet,px-pw/2,py-pw/2);
  ctx.fillStyle='#fff';for(let i=0;i<240;i++){const L=i%3,sp=[3,8,16][L]*s,sz=[1.2,1.8,2.8][L]*s;const x=wrapv(pr(e,i,0)*W-sp*t,W),y=pr(e,i,1)*H;
    ctx.globalAlpha=.3+.7*(.5+.5*Math.sin(t*(.4+pr(e,i,2)*2)+pr(e,i,3)*TAU));ctx.fillRect(x,y,sz,sz)}ctx.globalAlpha=1;
  const per=11,k=Math.floor(t/per),lt=t-k*per;if(lt<1.2){const R=rnd(k*7919+3);const x0=(.2+R()*.8)*W,y0=R()*H*.4,len=W*.2,a=Math.sin(lt/1.2*Math.PI),dx=-len*lt/1.2,dy=len*.45*lt/1.2;
    const g=ctx.createLinearGradient(x0+dx,y0+dy,x0+dx+len*.5,y0+dy-len*.22);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=2.4*s;ctx.beginPath();ctx.moveTo(x0+dx,y0+dy);ctx.lineTo(x0+dx+len*.5,y0+dy-len*.22);ctx.stroke()}};

SCENE_INIT.ocean=e=>{const{W,H,h}=e;const bg=mk(W,H),x=bg.getContext('2d');x.fillStyle=vgrad(x,H,[[0,hsl(h+20,50,8)],[.5,hsl(h,45,26)],[1,hsl(h,50,10)]]);x.fillRect(0,0,W,H);

  ctx.globalCompositeOperation='lighter';for(let k=0;k<14;k++){const y=H*(.5+k*.02),w=W*(.02+k*.004)*(1+.3*Math.sin(t*1.3+k));ctx.fillStyle=hsl(h+30,60,80,.12);ctx.fillRect(e.mx-w/2+Math.sin(t*.8+k*1.7)*W*.01,y,w,2*s)}ctx.globalCompositeOperation='source-over';

    ctx.strokeStyle=hsl(h+10,70,75,.22);ctx.lineWidth=2*s;ctx.stroke()}

SCENE_INIT.fire=e=>{const{W,H,h}=e;const bg=mk(W,H),x=bg.getContext('2d');x.fillStyle=vgrad(x,H,[[0,hsl(h-5,55,4)],[.65,hsl(h,70,9)],[1,hsl(h+8,85,20)]]);x.fillRect(0,0,W,H);

  const fl=.55+.12*Math.sin(t*2.7)+.07*Math.sin(t*7.3+1);ctx.globalAlpha=fl;ctx.drawImage(e.bot,-W*.15,H*.62,W*1.3,H*.7);ctx.globalAlpha=1;

    ctx.globalAlpha=Math.sin(ph*Math.PI)*(.5+.5*Math.sin(t*6+i));ctx.drawImage(i%3?e.em:e.em2,x-sz,y-sz,sz*2,sz*2)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'};

/* ice */
SCENE_INIT.ice=e=>{const{W,H,h}=e;const bg=mk(W,H),x=bg.getContext('2d');x.fillStyle=vgrad(x,H,[[0,hsl(h+20,55,6)],[1,hsl(h,45,24)]]);x.fillRect(0,0,W,H);
  for(let i=0;i<300;i++){x.fillStyle=`rgba(255,255,255,${.1+e.R()*.4})`;x.fillRect(e.R()*W,e.R()*H*.6,1.3*e.s,1.3*e.s)}

  for(let j=0;j<3;j++){const by=H*(.14+j*.08),th=H*(.16-j*.03),hue=[150,175,280][j]+(h-205)*.5;const g=ctx.createLinearGradient(0,by-th*.2,0,by+th);g.addColorStop(0,hsl(hue,90,60,0));g.addColorStop(.25,hsl(hue,90,62,.28-j*.05));g.addColorStop(1,hsl(hue,90,55,0));ctx.fillStyle=g;
    ctx.beginPath();for(let x=0;x<=W+step;x+=step){const y=by+Math.sin(x/W*TAU*1.2+t*.1*(j+1)+j)*H*.05+Math.sin(x/W*TAU*2.7-t*.07+j*2)*H*.02;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    for(let x=W+step;x>=0;x-=step){const y=by+th*(.7+.3*Math.sin(x/W*TAU*1.7+t*.13+j))+Math.sin(x/W*TAU*1.2+t*.1*(j+1)+j)*H*.05;ctx.lineTo(x,y)}ctx.closePath();ctx.fill()}

SCENE_INIT.city=e=>{const{W,H,h,s}=e;const bg=mk(W,H),x=bg.getContext('2d');x.fillStyle=vgrad(x,H,[[0,hsl(h,50,5)],[.7,hsl(h+25,55,17)],[1,hsl(h+40,50,10)]]);x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';x.drawImage(glow(hsl(h+40,80,55,.35)),-W*.2,H*.45,W*1.4,H*.7);x.globalCompositeOperation='source-over';
  e.wins=[];e.tops=[];
  [[.5,hsl(h,30,16),.35],[.62,hsl(h,35,8),.6]].forEach(([b,c,lit],L)=>{let px=-10;while(px<W){const bw=(40+e.R()*90)*s*(L?1.2:.8),bh=H*(.12+e.R()*(L?.3:.38));const top=H*(L?.98:.9)-bh-(L?0:H*.04);x.fillStyle=c;x.fillRect(px,top,bw,H-top);
      const ws=7*s,gp=12*s;for(let wy=top+gp;wy<H-gp;wy+=gp+ws*.6)for(let wx=px+gp*.6;wx<px+bw-ws-gp*.4;wx+=gp){if(e.R()<lit*.45){x.fillStyle=`hsla(${40+e.R()*20},90%,${65+e.R()*15}%,${L?.75:.35})`;x.fillRect(wx,wy,ws,ws*.7)}else if(L&&e.R()<.04)e.wins.push([wx,wy,ws,ws*.7])}
      if(L&&bh>H*.3)e.tops.push([px+bw/2,top]);px+=bw+(L?2:6)*s}});
  e.bg=bg;e.red=glow('rgba(255,60,60,.9)');e.dot=glow(hsl(h+60,90,70,.8))};

  ctx.save();ctx.drawImage(e.bg,0,0);ctx.globalCompositeOperation='lighter';

  for(let i=0;i<60;i++){const P=12+pr(e,i,0)*10,ph=wrapv(t/P+pr(e,i,1),1),x=pr(e,i,2)*W+Math.sin(t*.4+i)*10*s,y=H*(.95-ph*.9),r=(2+pr(e,i,3)*4)*s;ctx.globalAlpha=Math.sin(ph*Math.PI)*.7;ctx.drawImage(e.dot,x-r,y-r,r*2,r*2)}ctx.globalAlpha=1;

SCENE_INIT.nature=e=>{const{W,H,h,s}=e;const bg=mk(W,H),x=bg.getContext('2d');const sky=5+e.R()*30;x.fillStyle=vgrad(x,H,[[0,hsl(sky+230,45,20)],[.55,hsl(sky+5,62,50)],[1,hsl(sky+25,70,62)]]);x.fillRect(0,0,W,H);

    if(k===2){for(let i=0;i<26;i++){const tx=e.R()*W,ty=base-H*.02,th=(40+e.R()*70)*s;y.fillStyle=hsl(gh,40,10);y.beginPath();y.moveTo(tx,ty-th);y.lineTo(tx-th*.28,ty+4*s);y.lineTo(tx+th*.28,ty+4*s);y.fill()}}return c});

/* rain on a window, city lights blurred behind it */

  for(let i=0;i<90;i++){const warm=e.R()<.65,hue=warm?28+e.R()*25:h+e.R()*60-30,r=(18+e.R()*80)*s,y=H*(.35+e.R()*.6);b.globalAlpha=.25+e.R()*.5;b.drawImage(glow(hsl(hue,90,warm?62:60,.5)),e.R()*W-r,y-r,r*2,r*2)}
  x.filter=`blur(${Math.max(2,6*s)}px)`;x.drawImage(bk,0,0);x.filter='none';
  // glass: tiny static drops
  for(let i=0;i<Math.round(1400*W*H/2073600);i++){const r=(1+e.R()*3.4)*s,px=e.R()*W,py=e.R()*H;x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(px,py,r,0,TAU);x.fill();
    x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.arc(px,py+r*.25,r*.85,0,Math.PI);x.fill();x.fillStyle='rgba(255,255,255,.45)';x.fillRect(px-r*.45,py-r*.5,Math.max(1,r*.35),Math.max(1,r*.35))}
  // window frame
  const fw=22*s,fx=W*(isLand(e)?.64:.5),fy=H*(isLand(e)?.4:.36);x.fillStyle=hsl(h,25,4);x.fillRect(fx-fw/2,0,fw,H);x.fillRect(0,fy-fw/2,W,fw);

  x.globalCompositeOperation='lighter';x.drawImage(glow('hsla(32,90%,55%,.25)'),-W*.2,H*.55,W*.7,H*.7);x.globalCompositeOperation='source-over';

  for(let i=0;i<150;i++){const len=(30+pr(e,i,0)*50)*s,sp=(700+pr(e,i,1)*500)*s,x=pr(e,i,2)*W,y=wrapv(pr(e,i,3)*H+t*sp,H+len)-len;ctx.moveTo(x,y);ctx.lineTo(x-len*.08,y+len)}ctx.stroke();

  let px=win.x;x.fillStyle=hsl(h,30,7);while(px<win.x+win.w){const bw=(14+e.R()*34)*s,bh=win.h*(.12+e.R()*.3);x.fillRect(px,win.y+win.h-bh,bw+1,bh);
    for(let wy=win.y+win.h-bh+6*s;wy<win.y+win.h-4*s;wy+=9*s)for(let wx=px+4*s;wx<px+bw-5*s;wx+=8*s)if(e.R()<.22){x.fillStyle=`hsla(${40+e.R()*15},90%,70%,.8)`;x.fillRect(wx,wy,3.5*s,4*s);x.fillStyle=hsl(h,30,7)}px+=bw}

  const sx=L?W*.6:W*.08,sy=L?H*.3:H*.47,sw=L?W*.3:W*.84;y.fillStyle=hsl(25,30,18);y.fillRect(sx,sy,sw,10*s);let bx=sx+10*s;
  while(bx<sx+sw*.62){const bw=(10+e.R()*14)*s,bh=(40+e.R()*34)*s;y.fillStyle=hsl(e.R()*360,40,40+e.R()*15);y.fillRect(bx,sy-bh,bw,bh);bx+=bw+2*s}
  const ppx=sx+sw*.82,ppy=sy;y.fillStyle=hsl(15,45,45);y.beginPath();y.moveTo(ppx-22*s,ppy-38*s);y.lineTo(ppx+22*s,ppy-38*s);y.lineTo(ppx+16*s,ppy);y.lineTo(ppx-16*s,ppy);y.fill();
  for(let k=0;k<9;k++){const a=-Math.PI/2+(k-4)*.33;y.fillStyle=hsl(120+e.R()*30,40,32+e.R()*12);y.save();y.translate(ppx,ppy-38*s);y.rotate(a+Math.PI/2);y.beginPath();y.ellipse(0,-30*s,9*s,30*s,0,0,TAU);y.fill();y.restore()}
  // desk
  const dy=H*(L?.74:.7);e.dy=dy;y.fillStyle=hsl(25,40,32);y.fillRect(0,dy,W,14*s);y.fillStyle=hsl(25,32,17);y.fillRect(0,dy+14*s,W,H-dy);

/* cozy cabin: stone fireplace, snow at the window */
SCENE_INIT.cabin=e=>{const{W,H,s}=e,L=isLand(e);const bg=mk(W,H),x=bg.getContext('2d');x.fillStyle=vgrad(x,H,[[0,'#120c0a'],[1,'#22160f']]);x.fillRect(0,0,W,H);
  for(let yy=0;yy<H;yy+=46*s){x.fillStyle=`rgba(80,50,30,${.08+e.R()*.06})`;x.fillRect(0,yy,W,44*s)}

  for(let yy=top;yy<H;yy+=34*s){let xx=fx0+(e.R()*-30)*s;while(xx<fx1){const sw=(40+e.R()*50)*s;x.fillStyle=hsl(25+e.R()*20,10+e.R()*10,24+e.R()*14);if(x.roundRect){x.beginPath();x.roundRect(Math.max(fx0,xx)+2*s,yy+2*s,Math.min(sw,fx1-xx)-4*s,30*s,8*s);x.fill()}else x.fillRect(xx,yy,sw-4*s,30*s);xx+=sw}}
  const ox0=fx0+(fx1-fx0)*.18,ox1=fx1-(fx1-fx0)*.18,oy0=H*(L?.5:.62),oy1=H*.9;e.fb={x0:ox0,x1:ox1,y0:oy0,y1:oy1};
  x.fillStyle='#070504';x.beginPath();x.moveTo(ox0,oy1);x.lineTo(ox0,oy0+(ox1-ox0)*.25);x.quadraticCurveTo((ox0+ox1)/2,oy0-(ox1-ox0)*.1,ox1,oy0+(ox1-ox0)*.25);x.lineTo(ox1,oy1);x.closePath();x.fill();
  x.fillStyle='#4a2c18';x.fillRect(fx0-30*s,oy0-60*s,fx1-fx0+60*s,34*s);x.fillStyle='#2e1b0f';x.fillRect(fx0-30*s,oy0-28*s,fx1-fx0+60*s,6*s);

  [[-.55,.0,.2],[.5,.03,-.18],[0,-.05,.04]].forEach(([dx,dy,rot])=>{y.save();y.translate(cxm+dx*lw,oy1-22*s+dy*60*s);y.rotate(rot);y.fillStyle='#4b2d17';if(y.roundRect){y.beginPath();y.roundRect(-lw,-16*s,lw*2,32*s,16*s);y.fill()}else y.fillRect(-lw,-16*s,lw*2,32*s);
    y.fillStyle='#c79a63';y.beginPath();y.ellipse(lw,0,10*s,16*s,0,0,TAU);y.fill();y.strokeStyle='#8a6038';y.lineWidth=2*s;y.beginPath();y.ellipse(lw,0,5*s,9*s,0,0,TAU);y.stroke();y.restore()});

async function audioBlock(t0,t1,nFrames){const sr=48000;if(!SRC||t0>=SRC.duration)return null;const pad=.12,a=Math.max(0,t0-pad),b=Math.min(SRC.duration,t1+pad);

  else{const i=PAGES.findIndex(q=>q.t>t);if(i>=0&&PAGES[i].t-t<.04)return true}return false}

  return false}
async function renderRange(t0,t1,name,label){

  $('encInfo').textContent=`${W}×${H} · ${fps} fps · ${vc.kind.toUpperCase()}${ac?' + '+ac.kind.toUpperCase():''}`;
  const store_=new PartStore();
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.StreamTarget({onData:(d,p)=>store_.write(d,p),chunked:true,chunkSize:1<<23}),video:{codec:vc.kind,width:W,height:H,frameRate:fps},audio:ac?{codec:ac.kind,numberOfChannels:2,sampleRate:48000}:undefined,fastStart:false,firstTimestampBehavior:'offset'});
  let encErr=null;const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>encErr=e});venc.configure(vc.cfg);
  let aenc=null;if(ac){aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>encErr=e});aenc.configure(ac.cfg)}
  const oc=typeof OffscreenCanvas!=='undefined'?new OffscreenCanvas(W,H):Object.assign(document.createElement('canvas'),{width:W,height:H});const octx=oc.getContext('2d');
  const BLOCK=10,started=performance.now();const skSlot={};let aDone=0,result='fail';
  const quick=$('optQuick').checked,HOLD=Math.max(1,Math.round(fps/15));let lastKey=-1e9;
  try{for(let f=0;f<N;){
      if(cancelExport||encErr)break;
      let run=1;if(quick&&!smoothAt(t0+f/fps))while(f+run<N&&run<HOLD&&!smoothAt(t0+(f+run)/fps))run++;
      while(aenc&&aDone<Math.round(Math.min(dur,(f+run)/fps)*48000)){const bs=aDone/48000,be=Math.min(dur,bs+BLOCK);const target=Math.round(be*48000),n=target-aDone;
        if(n>0){const buf=await audioBlock(t0+bs,t0+be,n);const data=new Float32Array(n*2);if(buf){data.set(buf.getChannelData(0).subarray(0,n),0);data.set((buf.numberOfChannels>1?buf.getChannelData(1):buf.getChannelData(0)).subarray(0,n),n)}
          for(let s=0;s<n;s+=4800){const m=Math.min(4800,n-s),chunk=new Float32Array(m*2);chunk.set(data.subarray(s,s+m),0);chunk.set(data.subarray(n+s,n+s+m),m);
            const ad=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:m,numberOfChannels:2,timestamp:Math.round((aDone+s)/48000*1e6),data:chunk});aenc.encode(ad);ad.close()}}
        aDone=target;if(n<=0)break}
      const t=t0+f/fps;drawFrame(octx,t,W,H,skSlot);const key=f-lastKey>=fps*2;if(key)lastKey=f;
      const vf=new VideoFrame(oc,{timestamp:Math.round(f*1e6/fps),duration:Math.round(run*1e6/fps)});venc.encode(vf,{keyFrame:key});vf.close();

      if(Math.floor(f/20)!==Math.floor(fp/20)){const p=f/N,el=(performance.now()-started)/1000,eta=p>.005?el/p-el:0;$('progBar').style.width=(p*100).toFixed(2)+'%';
        $('expMsg').textContent=`${label?label+' · ':''}Rendering ${fmt(f/fps)} / ${fmt(dur)}${p>.005?` · ${(f/fps/el).toFixed(1)}× real time · about ${fmt(eta)} left`:''}`;await new Promise(r=>setTimeout(r,0))}}
    if(encErr)throw encErr;
    if(cancelExport){$('expMsg').textContent='Export cancelled.';return'cancel'}
    $('expMsg').textContent='Finishing file…';await venc.flush();if(aenc)await aenc.flush();muxer.finalize();
    const blob=store_.blob();$('progBar').style.width='100%';
    const r=await saveFile(blob,name);result=r;
    $('expMsg').textContent=r==='saved'?`Done: ${name} (${blob.size>1<<30?(blob.size/(1<<30)).toFixed(2)+' GB':(blob.size/1048576).toFixed(1)+' MB'})`:r==='declined'?'Save cancelled. Click Export to try again.':'Couldn\'t save the file.';
  }catch(e){console.error(e);$('expMsg').textContent='Export failed: '+(e&&e.message?e.message:e)}
  finally{try{venc.state!=='closed'&&venc.close()}catch(_){}try{aenc&&aenc.state!=='closed'&&aenc.close()}catch(_){}}
  return result}

Tonight, look up at the sky and imagine the Moon is simply gone. No explosion, no warning. One second it is there, and the next second there is only darkness and stars.

The first thing you would notice is the night. Without moonlight, nights would be much darker, and some animals that hunt by the light of the Moon would be totally confused.

But the real change would happen in the ocean. The Moon's gravity pulls on the water and creates the tides. Without it, the waves on the beach would become tiny, and many sea creatures would lose their homes.

What if the Sun went out for one week?

Here is the strange part: for the first eight minutes, nobody on Earth would even know. Light takes about eight minutes to travel from the Sun to us.

After that, the sky would turn black. Temperatures would start falling fast, and by the end of the week, oceans would begin to freeze at the surface and snow would cover most cities.

People would crowd around fire, heaters and any source of electricity they could find. And plants, without sunlight, would stop making oxygen.`;
